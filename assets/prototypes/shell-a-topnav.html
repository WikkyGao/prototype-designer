<!DOCTYPE html>
<!--
  变体 A · 顶部导航版（页面级备注）
  外壳不绑定视觉：下方「项目令牌」区由具体项目的前端 / UI 规范注入，
  未提供规范时使用中性默认值；外壳与页面样式只引用变量。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>变体 A · 顶部导航版 · 社区轻发言</title>
<style>
/* ============================================================
   项目令牌（PROJECT TOKENS）
   由项目前端 / UI 规范注入；未提供规范时使用以下中性默认值。
   换项目时只改这一段。
   ============================================================ */
:root {
  --font-sans: system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
  --font-meta: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;

  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --border: #E4E7EC;
  --border-strong: #CBD2DC;

  --text: #1F2429;
  --text-2: #5C6470;
  --text-3: #9096A0;

  --acc: #3B6EF0;
  --acc-hover: #2E5BD7;
  --acc-soft: rgba(59, 110, 240, .12);
  --annot: #E8833A;

  --ok: #2E9E62;
  --warn: #D98A1F;
  --bad: #D64545;

  --r-xs: 6px;
  --r-sm: 10px;
  --dur: .2s;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --shadow-md: 0 12px 32px rgba(31, 36, 41, .12);
}
</style>
<style>
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 var(--font-sans); -webkit-font-smoothing:antialiased; }
button { font: inherit; }
:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

.proto { position:sticky; top:0; z-index:80; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 20px; border-bottom:1px solid var(--border-strong); background:var(--surface); }
.proto .pl { flex:none; font:500 10px/1.4 var(--font-meta); letter-spacing:.16em; color:var(--text-3); }
.pnav { display:flex; flex-wrap:wrap; gap:4px; }
.pnav button { padding:5px 12px; border:1px solid var(--border); border-radius:var(--r-xs); background:var(--surface); color:var(--text-2); font:400 12.5px/1.5 var(--font-sans); cursor:pointer; transition:all var(--dur) var(--ease); }
.pnav button:hover { border-color:var(--border-strong); color:var(--text); }
.pnav button.on { border-color:var(--acc); background:var(--acc); color:#fff; }
.psp { display:flex; align-items:center; gap:6px; margin-left:auto; }
.note { width:100%; margin-top:2px; padding:9px 12px; border-left:2px solid var(--annot); border-radius:0 var(--r-xs) var(--r-xs) 0; background:var(--surface-2); color:var(--text-2); font-size:12px; line-height:1.7; }
.note[hidden] { display:none; }
.note b { color:var(--text); }
.note-item { margin:3px 0; padding:4px 7px; border-radius:4px; }
.note-item.is-current { background:var(--acc-soft); color:var(--text); }

.wrap { width:min(880px,100%); margin:0 auto; padding:30px 24px 120px; }
.page[hidden] { display:none !important; }
.page.is-active { animation:pageIn .25s var(--ease) both; }
@keyframes pageIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.top { padding-bottom:16px; border-bottom:1px solid var(--border); }
.top h1 { display:flex; align-items:center; gap:12px; margin:0; font:600 22px/1.3 var(--font-sans); }
.top .sub { max-width:64ch; margin-top:7px; color:var(--text-2); font-size:13px; }
.eyebrow { display:inline-flex; align-items:center; gap:8px; font:500 10px/1.6 var(--font-meta); letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); }
.eyebrow::before { content:""; width:16px; height:1px; background:var(--annot); }

.card { border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface); }
.form-card { margin-top:20px; padding:20px; }
.field { margin-bottom:16px; }
.field > label { display:block; margin-bottom:7px; font:500 12px/1.5 var(--font-sans); color:var(--text-2); }
.req { color:var(--bad); }
.input { width:100%; min-height:38px; padding:8px 11px; border:1px solid var(--border-strong); border-radius:var(--r-xs); background:var(--surface); color:var(--text); font:400 13.5px/1.5 var(--font-sans); outline:none; transition:all var(--dur) var(--ease); }
.input:hover { border-color:var(--text-3); }
.input:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); }
.input::placeholder { color:var(--text-3); }
.ta { min-height:96px; resize:vertical; }
.cnt { margin-top:5px; text-align:right; color:var(--text-3); font:10.5px/1.5 var(--font-meta); }
.cnt.over { color:var(--bad); }
.frow { display:flex; align-items:center; gap:14px; margin-top:4px; }
.anon { display:inline-flex; align-items:center; gap:8px; color:var(--text-2); font-size:13px; cursor:pointer; }
.toggle { position:relative; width:38px; height:21px; border:1px solid var(--border-strong); border-radius:999px; background:var(--surface-3); cursor:pointer; transition:all var(--dur) var(--ease); }
.toggle::after { content:""; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(31,36,41,.2); transition:all var(--dur) var(--ease); }
.toggle.on { background:var(--acc); border-color:var(--acc); }
.toggle.on::after { transform:translateX(17px); }
.btn { display:inline-flex; align-items:center; min-height:34px; padding:7px 15px; border:1px solid var(--border-strong); border-radius:var(--r-xs); background:var(--surface); color:var(--text-2); font:500 13px/1.4 var(--font-sans); cursor:pointer; transition:all var(--dur) var(--ease); }
.btn:hover { border-color:var(--text-3); color:var(--text); }
.btn-primary { border-color:var(--acc); background:var(--acc); color:#fff; }
.btn-primary:hover { background:var(--acc-hover); color:#fff; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

.list-card { margin-top:20px; padding:2px 14px; }
.post { display:flex; gap:11px; padding:13px 2px; border-bottom:1px solid var(--border); align-items:flex-start; }
.post:last-child { border-bottom:0; }
.avatar { display:grid; place-items:center; width:30px; height:30px; flex:none; border-radius:50%; background:var(--acc-soft); color:var(--acc); font:600 12px/1 var(--font-sans); }
.post-main { flex:1; min-width:0; }
.post-meta { display:flex; gap:8px; align-items:baseline; }
.post-meta b { color:var(--text); font-size:12.5px; }
.post-meta span { color:var(--text-3); font:10px/1.6 var(--font-meta); }
.post-main p { margin:4px 0 0; color:var(--text-2); font-size:13px; line-height:1.7; }
.del { flex:none; padding:2px 8px; border:1px solid var(--border); border-radius:4px; background:transparent; color:var(--text-3); font:10px/1.6 var(--font-meta); cursor:pointer; }
.del:hover { border-color:var(--bad); color:var(--bad); }
.empty-box { margin-top:20px; padding:34px 0; text-align:center; border:1px dashed var(--border-strong); border-radius:var(--r-sm); color:var(--text-3); font-size:12.5px; }
.acts { display:flex; align-items:center; gap:8px; }
.top-row { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; flex-wrap:wrap; }

.toast { position:fixed; left:50%; bottom:26px; z-index:300; padding:10px 15px; border:1px solid var(--border-strong); border-radius:var(--r-xs); background:var(--surface); color:var(--text); box-shadow:var(--shadow-md); font-size:12px; transform:translateX(-50%); }
.toast[hidden] { display:none; }
.toast.warn { border-color:var(--warn); color:var(--warn); }
</style>
</head>
<body>

<div class="proto">
  <span class="pl">PROTOTYPE · A</span>
  <nav class="pnav" id="pnav" aria-label="原型页面">
    <button type="button" data-target="发布动态" class="on">01 发布动态</button>
    <button type="button" data-target="动态列表">02 动态列表</button>
  </nav>
  <div class="psp">
    <button class="btn" type="button" id="allBtn" aria-expanded="false">看全部备注</button>
  </div>
  <div class="note" id="protoNote" hidden></div>
</div>

<main class="wrap" id="stage">
  <section class="page" data-page="发布动态" data-route="/post">
    <template data-page-note><b>页面说明：</b>标题为必填项，缺失时 Toast 提示并聚焦，不清空已填内容；内容 ≤140 字实时计数，超限禁用发布按钮；「匿名发布」开启后列表展示「匿名」，后端仍记录作者；发布成功后插入动态列表顶部并提示。</template>
    <div class="top">
      <div class="eyebrow">COMMUNITY · 轻发言</div>
      <h1>发布动态</h1>
      <p class="sub">登录用户可发布 140 字内的动态，支持匿名展示。</p>
    </div>
    <div class="card form-card">
      <div class="field">
        <label>标题 <span class="req">*</span></label>
        <input class="input" id="titleInput" placeholder="一句话概括这条动态">
      </div>
      <div class="field">
        <label>内容</label>
        <textarea class="input ta" id="bodyInput" maxlength="140" placeholder="今天有什么想说的？（≤140 字）"></textarea>
        <div class="cnt"><span id="cnt">0</span>/140</div>
      </div>
      <div class="frow">
        <label class="anon"><span class="toggle on" id="anonSwitch" role="switch" aria-checked="true" tabindex="0"></span> 匿名发布</label>
        <button class="btn btn-primary" type="button" id="btnPublish">发布</button>
      </div>
    </div>
  </section>

  <section class="page" data-page="动态列表" data-route="/timeline" hidden>
    <template data-page-note><b>页面说明：</b>动态按发布时间倒序展示，新发布在最上；仅作者可见「删除」入口，删除需二次确认且不可恢复；无动态时展示空状态与发布入口，不留空白列表。</template>
    <div class="top-row">
      <div class="top" style="flex:1">
        <div class="eyebrow">COMMUNITY · TIMELINE</div>
        <h1>动态列表</h1>
        <p class="sub">按发布时间倒序；仅作者可见删除入口。</p>
      </div>
      <div class="acts"><button class="btn btn-primary" type="button" id="btnGo">＋ 发布动态</button></div>
    </div>
    <div class="card list-card" id="postList">
      <div class="post">
        <span class="avatar">匿</span>
        <div class="post-main"><div class="post-meta"><b>匿名</b><span>10-22 10:24</span></div><p>把每周需求评审的结论都沉淀到原型里，回溯起来方便多了。</p></div>
        <button class="del" type="button">删除</button>
      </div>
      <div class="post">
        <span class="avatar">w</span>
        <div class="post-main"><div class="post-meta"><b>wikky</b><span>10-21 18:03</span></div><p>轻发言的关键是「轻」：不强制标题，字数一到就停。</p></div>
        <button class="del" type="button">删除</button>
      </div>
      <div class="post">
        <span class="avatar">棠</span>
        <div class="post-main"><div class="post-meta"><b>阿棠</b><span>10-21 09:12</span></div><p>匿名发言的标签样式和实名区分开，扫一眼就能认出来。</p></div>
      </div>
    </div>
    <div class="empty-box" id="emptyBox" hidden>暂无动态 —— 点击「发布动态」说点什么</div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script>
  (function () {
    "use strict";
    var buttons = document.querySelectorAll("#pnav button");
    var pages = document.querySelectorAll("#stage .page");
    var showAll = false;

    function render() {
      var current = document.querySelector("#pnav button.on").dataset.target;
      buttons.forEach(function (b) { b.classList.toggle("on", b.dataset.target === current); });
      pages.forEach(function (p) {
        p.hidden = p.dataset.page !== current;
        p.classList.toggle("is-active", !p.hidden);
      });
      var note = document.getElementById("protoNote");
      note.hidden = !showAll;
      document.getElementById("allBtn").textContent = showAll ? "收起备注" : "看全部备注";
      document.getElementById("allBtn").setAttribute("aria-expanded", showAll ? "true" : "false");
      note.innerHTML = [...pages].map(function (p) {
        var t = p.querySelector("template[data-page-note]");
        return '<div class="note-item' + (p.dataset.page === current ? " is-current" : "") + '">· ' + (t ? t.innerHTML : "本页暂无说明") + "</div>";
      }).join("");
    }
    function showPage(name) {
      buttons.forEach(function (b) { b.classList.toggle("on", b.dataset.target === name); });
      render();
      window.scrollTo({ top: 0 });
    }
    document.getElementById("pnav").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-target]"); if (b) showPage(b.dataset.target);
    });
    document.getElementById("allBtn").addEventListener("click", function () { showAll = !showAll; render(); });
    render();
    window.PD = { showPage: showPage };
  })();
</script>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var toastEl = $("toast"), toastTimer = null;
    function toast(msg, warn) {
      toastEl.textContent = msg;
      toastEl.classList.toggle("warn", !!warn);
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3600);
    }
    var anonOn = true;
    $("anonSwitch").addEventListener("click", function () {
      anonOn = !anonOn;
      this.classList.toggle("on", anonOn);
      this.setAttribute("aria-checked", anonOn ? "true" : "false");
    });
    $("bodyInput").addEventListener("input", function () {
      var n = this.value.length;
      $("cnt").textContent = n;
      this.parentNode.querySelector(".cnt").classList.toggle("over", n >= 140);
      $("btnPublish").disabled = n > 140;
    });
    $("btnPublish").addEventListener("click", function () {
      var title = $("titleInput"), body = $("bodyInput");
      if (!title.value.trim()) { toast("标题必填", true); title.focus(); return; }
      var div = document.createElement("div");
      div.className = "post";
      div.innerHTML = '<span class="avatar">' + (anonOn ? "匿" : "w") + '</span>' +
        '<div class="post-main"><div class="post-meta"><b>' + (anonOn ? "匿名" : "wikky") + '</b><span>刚刚</span></div><p></p></div>' +
        '<button class="del" type="button">删除</button>';
      div.querySelector("p").textContent = title.value + " —— " + body.value;
      $("postList").prepend(div);
      checkEmpty();
      title.value = ""; body.value = ""; $("cnt").textContent = "0";
      toast("已发布" + (anonOn ? "（匿名）" : ""));
      if (window.PD) window.PD.showPage("动态列表");
    });
    /* 删除按钮：postList 上事件委托，新增动态无需重绑 */
    $("postList").addEventListener("click", function (e) {
      var btn = e.target.closest(".del");
      if (!btn) return;
      if (confirm("确认删除这条动态？删除后不可恢复。")) {
        btn.closest(".post").remove();
        toast("已删除");
        checkEmpty();
      }
    });
    function checkEmpty() {
      var has = $("postList").querySelector(".post");
      $("emptyBox").hidden = !!has;
    }
    $("btnGo").addEventListener("click", function () { if (window.PD) window.PD.showPage("发布动态"); });
    checkEmpty();
  })();
</script>
</body>
</html>
