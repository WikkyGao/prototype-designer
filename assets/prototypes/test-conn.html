<!DOCTYPE html>
<html>
<head><style>
#view{width:800px;height:400px;background:#f0f2f5;position:relative;margin:20px;border:1px solid #ccc}
.dot{position:absolute;left:200px;top:200px;width:24px;height:30px}
#card{width:200px;background:#E3F2FD;border-left:4px solid #1976D2;padding:10px;position:absolute;right:20px;top:100px}
#connectionsLayer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000}
#connectionsLayer path{fill:none;stroke:#1565c0;stroke-width:1.5;stroke-dasharray:6 3;opacity:.7}
</style></head>
<body>
<div id="view">
  <div class="dot" id="dot"><svg width="24" height="30" viewBox="0 0 24 30"><defs><radialGradient id="td" cx="40%" cy="35%"><stop offset="0%" stop-color="#90caf9"/><stop offset="30%" stop-color="#1e88e5"/><stop offset="100%" stop-color="#0d47a1"/></radialGradient></defs><path d="M12 29 C12 29 0 16 0 8 C0 3.6 5.4 0 12 0 C18.6 0 24 3.6 24 8 C24 16 12 29 12 29Z" fill="url(#td)" stroke="#1565c0" stroke-width="1.2"/><path d="M6 7 C8 5 11 4 12 4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/><text x="12" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text></svg></div>
  <div id="card">📝 核心功能</div>
</div>
<script>
var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.id='connectionsLayer';
document.body.appendChild(svg);
function draw(){
  var d=document.getElementById('dot'),c=document.getElementById('card');
  var dR=d.getBoundingClientRect(),cR=c.getBoundingClientRect();
  var x1=dR.left+dR.width/2,y1=dR.top+dR.height,x2=cR.left-4,y2=cR.top+cR.height/2,mx=x1+(x2-x1)*0.5;
  svg.innerHTML='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2+'"/>';
}
draw();
window.addEventListener('resize',draw);
</script>
</body></html>
